function nivelClass(nivel) {
  if (!nivel) return "";
  var n = nivel.toLowerCase();
  if (n.indexOf("facil") >= 0 || n.indexOf("fcil") >= 0 || n.indexOf("easy") >= 0) return "tag-nivel-facil";
  if (n.indexOf("media") >= 0 || n.indexOf("inter") >= 0 || n.indexOf("diagn") >= 0) return "tag-nivel-media";
  if (n.indexOf("dific") >= 0 || n.indexOf("aten") >= 0) return "tag-nivel-dificil";
  return "tag-nivel-facil";
}

function renderLista(lista) {
  var container = document.getElementById("vista-lista");
  if (!lista || lista.length === 0) {
    container.innerHTML = "<div class=\"no-resultados\">No se encontro ninguna averia.<br>Prueba con otras palabras.</div>";
    return;
  }
  var grupos = {};
  lista.forEach(function(a) {
    if (!grupos[a.estancia]) grupos[a.estancia] = [];
    grupos[a.estancia].push(a);
  });
  var html = "";
  Object.keys(grupos).forEach(function(estancia) {
    html += "<div class=\"estancia-label\">" + estancia + "</div>";
    grupos[estancia].forEach(function(a) {
      var tieneVideo = a.videos && a.videos.length > 0;
      html += "<div class=\"averia-item\" onclick=\"verAveria('" + a.id + "')\">";
      html += "<div class=\"averia-id-badge\">" + a.id + "</div>";
      html += "<div class=\"averia-info\">";
      html += "<div class=\"averia-nombre\">" + a.nombre + "</div>";
      html += "<div class=\"averia-tags\">";
      html += "<span class=\"tag tag-estancia\">" + a.estancia + "</span>";
      if (a.nivel) html += "<span class=\"tag " + nivelClass(a.nivel) + "\">" + a.nivel + "</span>";
      if (!tieneVideo) html += "<span class=\"tag tag-sin-video\">Proximamente</span>";
      html += "</div></div>";
      html += "<div class=\"averia-arrow\">&#8250;</div>";
      html += "</div>";
    });
  });
  container.innerHTML = html;
}

function filtrar() {
  var q = document.getElementById("buscador").value.toLowerCase().trim();
  if (!q) { renderLista(AVERIAS); return; }
  var filtradas = AVERIAS.filter(function(a) {
    return a.nombre.toLowerCase().indexOf(q) >= 0 ||
           a.estancia.toLowerCase().indexOf(q) >= 0 ||
           (a.sintomas && a.sintomas.toLowerCase().indexOf(q) >= 0);
  });
  renderLista(filtradas);
}

function verAveria(id) {
  var a = null;
  for (var i = 0; i < AVERIAS.length; i++) {
    if (AVERIAS[i].id === id) { a = AVERIAS[i]; break; }
  }
  if (!a) {
    document.getElementById("vista-lista").style.display = "none";
    document.getElementById("vista-averia").style.display = "block";
    document.getElementById("detalle-contenido").innerHTML = "<div style=\"padding:40px;text-align:center;color:#aaa;\">Averia " + id + " no encontrada.</div>";
    return;
  }
  window.scrollTo(0, 0);
  document.getElementById("vista-lista").style.display = "none";
  document.getElementById("vista-averia").style.display = "block";
  var videosHTML = "";
  if (a.videos && a.videos.length > 0) {
    videosHTML = "<div class=\"videos-seccion\">Videos seleccionados</div>";
    a.videos.forEach(function(v, i) {
      videosHTML += "<div class=\"video-card\">";
      videosHTML += "<div class=\"video-etiqueta\">" + (v.etiqueta || "Video") + "</div>";
      videosHTML += "<div class=\"video-titulo\">" + v.titulo + "</div>";
      videosHTML += "<div class=\"video-meta\"><span>&#128250; " + v.canal + "</span></div>";
      videosHTML += "<a href=\"" + v.url + "\" target=\"_blank\" class=\"btn-ver\">&#9654; VER VIDEO / RECURSO</a>";
      videosHTML += "</div>";
    });
  } else {
    videosHTML = "<div class=\"videos-seccion\">Videos seleccionados</div><div class=\"sin-video-msg\">Videos en preparacion.<br>Proximamente disponibles.</div>";
  }
  document.getElementById("detalle-contenido").innerHTML =
    "<div class=\"detalle-hero\">" +
    "<div class=\"detalle-id\">AVERIA " + a.id + "</div>" +
    "<h1 class=\"detalle-titulo\">" + a.nombre + "</h1>" +
    "<div class=\"averia-tags\"><span class=\"tag tag-estancia\">" + a.estancia + "</span>" +
    (a.nivel ? "<span class=\"tag " + nivelClass(a.nivel) + "\">" + a.nivel + "</span>" : "") +
    "</div></div>" +
    "<div class=\"sintomas-box\"><div class=\"sintomas-label\">Que estas notando?</div><div class=\"sintomas-text\">" + a.sintomas + "</div></div>" +
    videosHTML;
}

function volverLista() {
  window.scrollTo(0, 0);
  document.getElementById("vista-lista").style.display = "block";
  document.getElementById("vista-averia").style.display = "none";
  document.getElementById("buscador").value = "";
  renderLista(AVERIAS);
}

window.addEventListener("popstate", function() {
  if (document.getElementById("vista-averia").style.display === "block") {
    volverLista();
  }
});

var params = new URLSearchParams(window.location.search);
var averiaParam = params.get("averia");
if (averiaParam) {
  renderLista(AVERIAS);
  verAveria(averiaParam);
} else {
  renderLista(AVERIAS);
}
</script>
</body>
</html>
