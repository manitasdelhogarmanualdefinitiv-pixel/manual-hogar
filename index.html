// LÓGICA — no tocar

function nivelClass(nivel) {
  if (!nivel) return "";
  const n = nivel.toLowerCase().replace(/[^a-záéíóúü]/gi,"");
  if (n.includes("facil") || n.includes("fácil")) return "tag-nivel-facil";
  if (n.includes("media")) return "tag-nivel-media";
  if (n.includes("dificil") || n.includes("difícil")) return "tag-nivel-dificil";
  return "tag-nivel-facil";
}

function renderLista(lista) {
  const container = document.getElementById("vista-lista");
  if (lista.length === 0) {
    container.innerHTML = `<div class="no-resultados">No se encontró ninguna avería.<br>Prueba con otras palabras.</div>`;
    return;
  }

  // Agrupar por estancia
  const grupos = {};
  lista.forEach(a => {
    if (!grupos[a.estancia]) grupos[a.estancia] = [];
    grupos[a.estancia].push(a);
  });

  let html = "";
  for (const estancia in grupos) {
    html += `<div class="estancia-label">${estancia}</div>`;
    grupos[estancia].forEach(a => {
      const tieneVideo = a.videos && a.videos.length > 0;
      html += `
        <div class="averia-item" onclick="verAveria('${a.id}')">
          <div class="averia-id-badge">${a.id}</div>
          <div class="averia-info">
            <div class="averia-nombre">${a.nombre}</div>
            <div class="averia-tags">
              <span class="tag tag-estancia">${a.estancia}</span>
              ${a.nivel ? `<span class="tag ${nivelClass(a.nivel)}">${a.nivel}</span>` : ""}
              ${!tieneVideo ? `<span class="tag tag-sin-video">Vídeo próximamente</span>` : ""}
            </div>
          </div>
          <div class="averia-arrow">›</div>
        </div>`;
    });
  }
  container.innerHTML = html;
}

function filtrar() {
  const q = document.getElementById("buscador").value.toLowerCase().trim();
  if (!q) { renderLista(AVERIAS); return; }
  const filtradas = AVERIAS.filter(a =>
    a.nombre.toLowerCase().includes(q) ||
    a.estancia.toLowerCase().includes(q) ||
    (a.sintomas && a.sintomas.toLowerCase().includes(q))
  );
  renderLista(filtradas);
}

function verAveria(id) {
  const a = AVERIAS.find(x => x.id === id);
  if (!a) return;

  window.scrollTo(0, 0);
  document.getElementById("vista-lista").style.display = "none";
  document.getElementById("vista-averia").style.display = "block";

  const etiquetas = ["Vídeo recomendado", "Alternativa", "Otra opción"];
  let videosHTML = "";

  if (a.videos && a.videos.length > 0) {
    videosHTML = `<div class="videos-seccion">Vídeos seleccionados</div>`;
    a.videos.forEach((v, i) => {
      videosHTML += `
        <div class="video-card">
          <div class="video-etiqueta">${v.etiqueta || etiquetas[i] || "Vídeo"}</div>
          <div class="video-titulo">${v.titulo}</div>
          <div class="video-meta">
            <span>📺 ${v.canal}</span>
            <span>⏱ ${v.duracion}</span>
          </div>
          <a href="${v.url}" target="_blank" class="btn-ver">▶ VER VÍDEO</a>
        </div>`;
    });
  } else {
    videosHTML = `
      <div class="videos-seccion">Vídeos seleccionados</div>
      <div class="sin-video-msg">
        🎬 Vídeos en preparación.<br>Próximamente disponibles.
      </div>`;
  }

  document.getElementById("detalle-contenido").innerHTML = `
    <div class="detalle-hero">
      <div class="detalle-id">AVERÍA ${a.id}</div>
      <h1 class="detalle-titulo">${a.nombre}</h1>
      <div class="averia-tags">
        <span class="tag tag-estancia">${a.estancia}</span>
        ${a.nivel ? `<span class="tag ${nivelClass(a.nivel)}">${a.nivel}</span>` : ""}
      </div>
    </div>
    <div class="sintomas-box">
      <div class="sintomas-label">¿Qué estás notando?</div>
      <div class="sintomas-text">${a.sintomas}</div>
    </div>
    ${videosHTML}
  `;
}

function volverLista() {
  window.scrollTo(0, 0);
  document.getElementById("vista-lista").style.display = "block";
  document.getElementById("vista-averia").style.display = "none";
  document.getElementById("buscador").value = "";
  renderLista(AVERIAS);
}

// Manejar el botón atrás del móvil
window.addEventListener("popstate", () => {
  if (document.getElementById("vista-averia").style.display === "block") {
    volverLista();
  }
});

// Inicio — si viene con ?averia=001 desde el PDF, abre directamente esa avería
const params = new URLSearchParams(window.location.search);
const averiaParam = params.get("averia");
if (averiaParam) {
  renderLista(AVERIAS);
  verAveria(averiaParam);
} else {
  renderLista(AVERIAS);
}
</script>
</body>
</html>
